<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractal Explorer</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="controls" aria-label="Fractal controls">
        <h1>Fractal Explorer</h1>
        <label>
          Fractal type
          <select id="fractalType">
            <option value="mandelbrot">Mandelbrot</option>
            <option value="julia">Julia</option>
          </select>
        </label>
        <label>
          Max iterations
          <input id="iterations" type="range" min="50" max="2000" value="500" step="10" />
          <output id="iterationsValue">500</output>
        </label>
        <label>
          Color palette
          <select id="palette">
            <option value="sunset">Sunset</option>
            <option value="ocean">Ocean</option>
            <option value="mono">Monochrome</option>
          </select>
        </label>
        <button id="resetView" type="button">Reset view</button>
        <p class="hint">Scroll to zoom, drag to pan.</p>
      </section>
      <section class="viewer">
        <canvas id="fractalCanvas" width="960" height="640"></canvas>
        <div id="status" role="status" aria-live="polite">Rendering…</div>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
